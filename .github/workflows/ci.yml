# Tests only. This repo is public: it cannot call the private reusable deploy workflow of
# exiosv-lab-infra, and a public repo must not use the self-hosted devicex2 runner.
# Deploy: exiosv-lab-infra/k8s/scripts/build-images.sh tg-garmin-to-osm, then roll the deployment.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: pytest -q
