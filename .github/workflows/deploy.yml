name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: pytest -q
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ExiosV/exiosv-lab-infra/.github/workflows/k8s-deploy-app.yml@main
    with:
      image: tg-garmin-to-osm
      dockerfile: Dockerfile
      namespace: tg-garmin-to-osm
      workload: deployment/tg-garmin-to-osm-prod